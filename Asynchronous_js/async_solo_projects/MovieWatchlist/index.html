
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Document</title>
</head>
<body id="body" class="min-h-screen flex flex-col">
    <header class="relative bg-[url(../assets/headerimg.png)] bg-black opacity-100 text-[#ffffff] bg-cover bg-no-repeat h-64 flex flex-col justify-center items-center">
        
        <div class="font-inter flex w-1/2 flex justify-between items-center">
            <h2 class="font-extrabold text-4xl">Find your film</h2>
            <p class="font-bold text-md"><a href="./src/watchlist.html">My Watchlist</a></p>
        </div>

        <div class="absolute bottom-[-20px] flex w-1/2 flex justify-between items-center bg-white rounded-md border-1 border-gray-400">
            <div class="flex justify-center items-center  text-gray-700 w-[10%] h-full text-center p-2">
                <img src="./assets/icons8-search.svg" alt="search-icon" class="w-6 ">   
            </div>
            <input type="text" placeholder="Search for a movie" id="input" class="w-[70%] border-none outline-none p-2 text-gray-700 font-semibold border-white h-full">
            <button id="btn" class="w-[20%] border-l-2 border-gray-300 bg-gray-50 rounded-r-md text-center p-2 text-gray-700 font-semibold cursor-pointer">Search</button>
        </div>
    
    </header>
    
    <main id="content" class="flex-1 flex flex-col justify-center items-center pt-10">
        
        <div id="exploring" class="flex flex-col justify-center items-center ">
            <div>
                <img src="./assets/Icon.png" alt="icon_image">
            </div>
            <div>
                <p class="text-gray-300 font-bold">Start exploring</p>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
